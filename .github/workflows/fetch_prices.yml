name: Fetch energy prices

on:
  schedule:
    - cron: "0 18 * * 4"   # every Thursday at 18:00 UTC (the Oil Bulletin is published on Thursdays)
  workflow_dispatch:        # manual run from the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the prices
        run: |
          pip install -r requirements.txt
          python fetch_prices.py

      - name: Commit the new data
        run: |
          git config user.name "Davide Corbo"
          git config user.email "189027351+iddadobroc@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Energy prices download $(date -u +%F)"
          git push
